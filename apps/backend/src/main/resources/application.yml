spring:
  application:
    name: en-learning-backend
  # Đọc bí mật từ file .env (KEY=VALUE) đặt cạnh pom.xml; không commit file này.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:en_learning}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:en_learning}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ kiểm tra khớp với entity.
      ddl-auto: validate
    properties:
      # Cùng serverTimezone=UTC ở JDBC URL để Instant không bị lệch giờ.
      hibernate.jdbc.time_zone: UTC
  # Bài nói: mỗi tệp âm thanh tối đa 5MB, cả lần nộp 15MB (khớp SpeakingSubmissionService). Âm thanh không được lưu.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Bộ nhớ đệm Caffeine trong tiến trình. Mỗi tên đệm cần @CacheEvict ở nơi ghi tương ứng (xem CacheConfig).
  cache:
    type: caffeine
    cache-names: topics
    caffeine:
      spec: maximumSize=100,expireAfterWrite=5m
  # Gmail SMTP. Để trống MAIL_USERNAME/MAIL_PASSWORD thì email chỉ được ghi ra log (xem MailConfig).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  # Khớp baseURL '/api' của frontend, ví dụ POST /api/auth/login.
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Kiểm tra sức khoẻ không được mở kết nối SMTP: thiếu cấu hình sẽ làm cả /health báo DOWN.
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Mặc định để trống thay vì bỏ hẳn, để thiếu bí mật báo lỗi validate rõ ràng ở SecurityProperties.
  security:
    jwt-secret: ${JWT_SECRET:}
    reset-code-secret: ${RESET_CODE_SECRET:}
    cookie-secure: ${COOKIE_SECURE:false}
  mail:
    from: ${MAIL_FROM:}
  # GEMINI_API_KEY trống thì Luyện viết/Chat/Nói dùng bản giả (xem ai/GeminiKeyMissing).
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    gemini-timeout: ${GEMINI_TIMEOUT:45s}
    grading-timeout: ${AI_GRADING_TIMEOUT:60s}
    fake-latency: ${AI_FAKE_LATENCY:1500ms}
  # Hạn mức chat: tối đa daily-limit câu trợ lý trả lời mỗi người mỗi ngày (giờ Asia/Ho_Chi_Minh).
  chat:
    daily-limit: ${CHAT_DAILY_LIMIT:30}
  # Chỉ có tác dụng ở profile dev. if-empty: chỉ nạp phần còn thiếu; reset-demo: xoá dữ liệu demo (email @demo.enlearning.vn) rồi nạp lại.
  seed:
    mode: ${SEED_MODE:if-empty}
  scheduling:
    enabled: true
  # Nhắc học: quét mỗi phút; người dùng đến giờ nhắc (theo múi giờ riêng) mà trễ tối đa catch-up thì vẫn được nhắc.
  reminder:
    catch-up: 1h
  # Dọn dẹp định kỳ; các *-retention là thời gian giữ lại sau khi hết hạn.
  cleanup:
    token-retention: 1d
    empty-session-retention: 30d
    speaking-in-progress-retention: 24h
  # Giới hạn tần suất theo IP: tối đa capacity request mỗi window.
  rate-limit:
    enabled: true
    login: { capacity: 10, window: 1m }
    check-email: { capacity: 30, window: 1m }
    forgot-password: { capacity: 5, window: 1m }
